[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-work-report"
version = "0.1.1"
description = "扫描指定路径下所有 Git 仓库在指定日期指定提交人的所有提交"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click>=8.0"]

[project.scripts]
coding-work-report = "generate_work_report.cli:main"

[project.urls]
Homepage = "https://github.com/IVEN-CN/coding-work-report"
Repository = "https://github.com/IVEN-CN/coding-work-report"

[tool.hatch.build.targets.wheel]
packages = ["generate_work_report"]
